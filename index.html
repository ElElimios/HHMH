<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HandHandHand</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>
    
    <header class="autumn-header">
        <div class="logo-container">
            <img src="PLACEHOLDER" class="custom-logo">
        </div>
        <h1>Hand Hand and more Hand 1.0</h1>
    </header>

    <main>
        <section class="camera-section">
            <div class="camera-wrapper">
                <img src="PLACEHOLDER" alt="frameeeeee" class="custom-frame">

                <video id="video-input" autoplay playsinline></video>
                <canvas id="output-canvas"></canvas>
            </div>

            <div class="controls">
                <button id="btn-rps">Rock, Paper, Scissors</button>

            </div>

        </section>
    </main>

</body>
</html>
